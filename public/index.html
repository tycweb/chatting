<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>tyce-Chat</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Critical CSS: applies instantly, before style.css finishes loading,
     so the loading screen never flashes as a bare unstyled image. */
  html, body { margin:0; height:100%; background:#000; }
  #loading-screen {
    position: fixed; inset: 0; background:#000; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    z-index:9999; color:#fff; gap:16px;
  }
  #loading-screen img { border-radius:20px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
<div id="loading-screen">
  <img src="/icon-192.png" alt="Tycept" width="80" height="80">
  <p id="loading-text">Connecting to GroupChat...</p>
  <div class="spinner"></div>
  <div class="loading-dots"><span></span><span></span><span></span></div>
</div>
  <!-- Join screen -->
  <div id="join-screen" class="screen join-screen">
    <div class="join-card">
      <div class="brand">
        <div class="brand-mark">T</div>
        <h1>Tycept</h1>
      </div>
      <p class="join-sub">Enter a name to join the room.</p>
      <input id="name-input" class="name-input" maxlength="24" placeholder="Your name" autocomplete="off" />
      <button id="join-btn" class="btn-primary">Join chat</button>
      <p id="join-error" class="join-error"></p>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen chat-screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <div class="brand-mark small">T</div>
        <div>
          <h2>Chat</h2>
          <p id="presence-line" class="presence-line">connecting…</p>
        </div>
      </div>
      <div class="header-right">
        <button id="search-btn" class="icon-btn" aria-label="Search messages" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound" type="button">🔔</button>
        <div id="connection-dot" class="connection-dot" title="Connection status"></div>
      </div>
    </header>

    <!-- Search bar -->
    <div id="search-bar" class="search-bar hidden">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" class="search-input" placeholder="Search in chat" autocomplete="off" />
      <span id="search-count" class="search-count"></span>
      <button id="search-prev" class="search-nav-btn" aria-label="Previous result" type="button">˄</button>
      <button id="search-next" class="search-nav-btn" aria-label="Next result" type="button">˅</button>
      <button id="search-close" class="search-nav-btn search-close" aria-label="Close search" type="button">✕</button>
    </div>

    <main id="message-list" class="message-list" aria-live="polite"></main>

    <button id="jump-pill" class="jump-pill hidden" type="button">
      <span id="jump-count"></span> <span id="jump-label">New messages</span> ↓
    </button>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span></span><span></span><span></span>
      <em id="typing-name"></em>
    </div>

    <!-- Reply preview bar -->
    <div id="reply-preview" class="reply-preview hidden">
      <div class="reply-preview-bar"></div>
      <div class="reply-preview-body">
        <p class="reply-preview-name" id="reply-preview-name"></p>
        <p class="reply-preview-text" id="reply-preview-text"></p>
      </div>
      <button id="reply-preview-close" class="reply-preview-close" aria-label="Cancel reply" type="button">✕</button>
    </div>
    <!-- Edit preview bar -->
<div id="edit-preview" class="reply-preview edit-preview hidden">
  <div class="reply-preview-bar"></div>
  <div class="reply-preview-body">
    <p class="reply-preview-name">Editing message</p>
  </div>
  <button id="edit-preview-close" class="reply-preview-close" aria-label="Cancel edit" type="button">✕</button>
</div>

    <footer class="composer">
      <button id="attach-btn" class="attach-btn" aria-label="Send a photo" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-5-5L5 21"/></svg>
      </button>
      <input id="image-input" type="file" accept="image/*,video/*" hidden />
      <textarea id="message-input" class="message-input" placeholder="Message" rows="1"></textarea>
      <button id="send-btn" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </footer>
  </div>

  <!-- Fullscreen image viewer -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="" />
    <a id="lightbox-download" class="lightbox-download" download="photo.jpg" aria-label="Download photo" title="Download">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
    </a>
  </div>

  <!-- Exit confirmation modal -->
  <div id="exit-modal" class="exit-modal hidden">
    <div class="exit-modal-card">
      <p class="exit-modal-title">Leave Tycept?</p>
      <p class="exit-modal-sub">You'll stop receiving messages until you reopen the app.</p>
      <div class="exit-modal-actions">
        <button id="exit-cancel-btn" class="exit-btn exit-btn-cancel" type="button">Stay</button>
        <button id="exit-confirm-btn" class="exit-btn exit-btn-confirm" type="button">Exit</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
